<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Christmas Tree 2026</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0d12;
            color: #d8dee9;
            font-family: 'Consolas', 'Menlo', 'DejaVu Sans Mono', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            background-color: #0d1017;
            border-radius: 4px;
            max-width: 98vw;
            max-height: 90vh;
            object-fit: contain;
        }
        .controls {
            margin-top: 12px;
            font-size: 13px;
            color: #6c7a89;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        span.key {
            color: #a3be8c;
            font-weight: bold;
        }
    </style>
</head>
<body>

<canvas id="treeCanvas"></canvas>
<div class="controls">
    <div><span class="key">[SPACE]</span> Пауза / Продолжить</div>
    <div><span class="key">[R]</span> Перезапуск</div>
    <div><span class="key">[S]</span> Скриншот</div>
</div>

<script>
const canvas = document.getElementById('treeCanvas');
const ctx = canvas.getContext('2d');

const COLS = 88;
const ROWS = 74;
const FONT_SIZE = 12;
const CHAR_W = 8;
const CHAR_H = 14;

canvas.width = COLS * CHAR_W;
canvas.height = ROWS * CHAR_H;

const RAMP = " .:-=+*#%@";
const STAR_ART = [
    "   .   ",
    "  \\|/  ",
    " --*-- ",
    "  /|\\  ",
    "   '   "
];

const COLORS = {
    BG: [13, 16, 23],
    GREEN: [46, 184, 92],
    DARK_GREEN: [18, 92, 48],
    SNOW: [235, 244, 255],
    GOLD: [255, 215, 64],
    RED: [235, 77, 75],
    BLUE: [72, 168, 255],
    TRUNK: [130, 88, 52],
    WHITE: [255, 255, 255]
};

const MESSAGE = "MERRY CHRISTMAS 2026";

let particles = [];
let snowFlakes = [];
let t = 0;
let paused = false;
let lastTime = performance.now();

const rand = (min, max) => Math.random() * (max - min) + min;
const clamp = (val, min, max) => Math.max(min, Math.min(max, val));
const mixColor = (c1, c2, ratio) => [
    Math.round(c1[0] * (1 - ratio) + c2[0] * ratio),
    Math.round(c1[1] * (1 - ratio) + c2[1] * ratio),
    Math.round(c1[2] * (1 - ratio) + c2[2] * ratio)
];

function buildTree() {
    particles = [];
    const Y0 = -0.82;
    const Y1 = 0.68;
    const GROUND = 0.82;

    const layers = 24;
    for (let i = 0; i < layers; i++) {
        const yBase = Y0 + (Y1 - Y0) * (i / (layers - 1));
        const u = (yBase - Y0) / (Y1 - Y0);
        const maxR = 0.05 + 0.44 * Math.pow(u, 0.85);
        const branches = Math.floor(6 + 12 * (1 - u * 0.3));

        for (let b = 0; b < branches; b++) {
            const baseAngle = (Math.PI * 2 * b) / branches + i * 0.45 + rand(-0.15, 0.15);
            const branchLen = maxR * rand(0.85, 1.05);
            const steps = Math.floor(15 + 25 * u);

            for (let s = 0; s < steps; s++) {
                const f = s / steps;
                const r = branchLen * f;
                const droop = 0.06 * Math.pow(f, 1.8) * (0.5 + u);
                const y = yBase + droop;
                const angle = baseAngle + Math.sin(f * 3) * 0.15;

                const spread = 0.025 * (1 - f * 0.5);
                const px = r * Math.cos(angle) + rand(-spread, spread);
                const pz = r * Math.sin(angle) + rand(-spread, spread);
                const py = y + rand(-spread, spread);

                const isSnow = py < yBase + droop - spread * 0.2 && Math.random() < 0.32;
                const col = isSnow ? COLORS.SNOW : mixColor(COLORS.DARK_GREEN, COLORS.GREEN, f * 0.8 + rand(0, 0.2));

                particles.push({
                    x: px, y: py, z: pz,
                    color: col,
                    tGrow: u * 3.5 + f * 0.8,
                    type: 'needle'
                });
            }

            if (Math.random() < 0.65) {
                const lightColors = [COLORS.RED, COLORS.GOLD, COLORS.BLUE, COLORS.WHITE];
                particles.push({
                    x: branchLen * Math.cos(baseAngle),
                    y: yBase + 0.06 * (0.5 + u),
                    z: branchLen * Math.sin(baseAngle),
                    color: lightColors[Math.floor(Math.random() * lightColors.length)],
                    tGrow: u * 3.5 + 1.0,
                    type: 'light',
                    phase: rand(0, Math.PI * 2)
                });
            }
        }
    }

    for (let i = 0; i < 450; i++) {
        const y = rand(Y1 - 0.05, GROUND);
        const angle = rand(0, Math.PI * 2);
        const r = rand(0.02, 0.065);
        particles.push({
            x: r * Math.cos(angle),
            y: y,
            z: r * Math.sin(angle),
            color: COLORS.TRUNK,
            tGrow: 3.8 + rand(0, 0.5),
            type: 'trunk'
        });
    }

    const turns = 4.2;
    const garlandPoints = 550;
    for (let i = 0; i < garlandPoints; i++) {
        const u = i / garlandPoints;
        const y = Y0 + 0.05 + (Y1 - Y0 - 0.05) * u;
        const r = (0.06 + 0.45 * Math.pow(u, 0.85)) * 1.03;
        const angle = turns * Math.PI * 2 * u;
        const sag = Math.abs(Math.sin(angle * 2.5)) * 0.025;

        particles.push({
            x: r * Math.cos(angle),
            y: y + sag,
            z: r * Math.sin(angle),
            color: COLORS.GOLD,
            tGrow: 4.5 + u * 2.5,
            type: 'garland'
        });
    }

    const giftBoxes = [
        { x: -0.24, z: 0.16, w: 0.14, h: 0.11, d: 0.14, box: COLORS.RED, rib: COLORS.GOLD },
        { x: 0.22,  z: 0.18, w: 0.16, h: 0.10, d: 0.12, box: COLORS.BLUE, rib: COLORS.WHITE },
        { x: -0.14, z: -0.22, w: 0.13, h: 0.13, d: 0.13, box: COLORS.GOLD, rib: COLORS.RED },
        { x: 0.26,  z: -0.14, w: 0.12, h: 0.09, d: 0.12, box: COLORS.GREEN, rib: COLORS.GOLD }
    ];

    giftBoxes.forEach((g, idx) => {
        const step = 0.016;
        for (let dx = -g.w / 2; dx <= g.w / 2; dx += step) {
            for (let dy = 0; dy <= g.h; dy += step) {
                for (let dz = -g.d / 2; dz <= g.d / 2; dz += step) {
                    if (Math.abs(Math.abs(dx) - g.w / 2) < step ||
                        Math.abs(Math.abs(dz) - g.d / 2) < step ||
                        dy > g.h - step) {
                        const isRibbon = Math.abs(dx) < 0.018 || Math.abs(dz) < 0.018;
                        particles.push({
                            x: g.x + dx,
                            y: GROUND - dy,
                            z: g.z + dz,
                            color: isRibbon ? g.rib : g.box,
                            tGrow: 7.0 + idx * 0.4,
                            type: 'gift'
                        });
                    }
                }
            }
        }
    });

    snowFlakes = [];
    for (let i = 0; i < 160; i++) {
        snowFlakes.push({
            col: Math.floor(rand(0, COLS)),
            row: rand(0, ROWS),
            speed: rand(2, 6),
            char: Math.random() < 0.5 ? '.' : '*'
        });
    }
}

function render(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (!paused) {
        t += dt;
    }

    ctx.fillStyle = `rgb(${COLORS.BG.join(',')})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const charBuf = Array.from({ length: ROWS }, () => Array(COLS).fill(' '));
    const colorBuf = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    const zBuf = Array.from({ length: ROWS }, () => Array(COLS).fill(-999));

    snowFlakes.forEach(s => {
        if (!paused) {
            s.row = (s.row + s.speed * dt) % ROWS;
        }
        const r = Math.floor(s.row);
        const c = s.col;
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
            charBuf[r][c] = s.char;
            colorBuf[r][c] = 'rgba(180, 195, 215, 0.45)';
        }
    });

    const angleY = t * 0.65;
    const cosA = Math.cos(angleY);
    const sinA = Math.sin(angleY);

    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (t < p.tGrow) continue;

        const growScale = clamp((t - p.tGrow) * 2.5, 0, 1);

        const rx = (p.x * cosA - p.z * sinA) * growScale;
        const rz = (p.x * sinA + p.z * cosA) * growScale;
        const ry = p.y;

        const fov = 2.4;
        const zCam = rz + fov;
        if (zCam <= 0.1) continue;

        const projX = rx / zCam;
        const projY = ry / zCam;

        const col = Math.round(COLS / 2 + projX * COLS * 0.95);
        const row = Math.round(ROWS * 0.48 + projY * ROWS * 0.88);

        if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
            if (rz > zBuf[row][col]) {
                zBuf[row][col] = rz;

                const depthShade = clamp((rz + 0.6) / 1.2, 0.25, 1.0);
                let finalColor = p.color;
                let ch = RAMP[Math.floor(depthShade * (RAMP.length - 1))];

                if (p.type === 'light') {
                    const blink = Math.sin(t * 5 + p.phase) > 0;
                    ch = blink ? '@' : 'o';
                    if (!blink) finalColor = mixColor(p.color, COLORS.BG, 0.5);
                } else if (p.type === 'garland') {
                    ch = '*';
                }

                const shaded = finalColor.map(c => Math.round(c * (0.45 + 0.55 * depthShade)));
                charBuf[row][col] = ch;
                colorBuf[row][col] = `rgb(${shaded.join(',')})`;
            }
        }
    }

    const T_STAR = 8.5;
    if (t >= T_STAR) {
        const starRowCenter = Math.round(ROWS * 0.48 + (-0.87 / 2.4) * ROWS * 0.88);
        const starColCenter = Math.floor(COLS / 2);
        const pulse = 0.75 + 0.25 * Math.sin(t * 6);
        const starCol = COLORS.GOLD.map(c => Math.min(255, Math.round(c * (0.8 + 0.4 * pulse))));

        for (let sr = 0; sr < STAR_ART.length; sr++) {
            for (let sc = 0; sc < STAR_ART[sr].length; sc++) {
                const ch = STAR_ART[sr][sc];
                if (ch !== ' ') {
                    const r = starRowCenter - 2 + sr;
                    const c = starColCenter - 3 + sc;
                    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                        charBuf[r][c] = ch;
                        colorBuf[r][c] = `rgb(${starCol.join(',')})`;
                    }
                }
            }
        }
    }

    const T_MSG = 9.5;
    if (t >= T_MSG) {
        const msgRow = ROWS - 4;
        const startCol = Math.floor((COLS - MESSAGE.length) / 2);
        const visibleChars = Math.min(MESSAGE.length, Math.floor((t - T_MSG) * 14));

        for (let i = 0; i < visibleChars; i++) {
            const ch = MESSAGE[i];
            if (ch !== ' ') {
                const c = startCol + i;
                const wave = Math.sin(t * 4 - i * 0.4);
                const col = wave > 0.3 ? COLORS.GOLD : (wave < -0.3 ? COLORS.RED : COLORS.WHITE);
                charBuf[msgRow][c] = ch;
                colorBuf[msgRow][c] = `rgb(${col.join(',')})`;
            }
        }
    }

    ctx.font = `${FONT_SIZE}px Consolas, Menlo, Monaco, monospace`;
    ctx.textBaseline = 'top';

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const ch = charBuf[r][c];
            if (ch !== ' ') {
                ctx.fillStyle = colorBuf[r][c];
                ctx.fillText(ch, c * CHAR_W, r * CHAR_H);
            }
        }
    }

    ctx.fillStyle = '#e5c07b';
    ctx.fillText(`t ${t.toFixed(2)}s`, (COLS - 10) * CHAR_W, 8);

    requestAnimationFrame(render);
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        paused = !paused;
    } else if (e.code === 'KeyR') {
        t = 0;
        buildTree();
    } else if (e.code === 'KeyS') {
        const link = document.createElement('a');
        link.download = 'ascii-christmas-tree.png';
        link.href = canvas.toDataURL();
        link.click();
    }
});

buildTree();
requestAnimationFrame(render);
</script>
</body>
</html>
