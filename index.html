<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#030608"><title>ASCII Christmas · AeryxVPN</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#02070b;color:#c7d2d0;font-family:Consolas,"Courier New",monospace;overflow:hidden}
body{position:relative;background:
 radial-gradient(ellipse at 50% 48%,rgba(28,78,54,.22) 0%,rgba(12,35,34,.16) 28%,transparent 62%),
 radial-gradient(ellipse at 16% 78%,rgba(115,50,37,.13),transparent 33%),
 radial-gradient(ellipse at 86% 22%,rgba(36,66,106,.15),transparent 36%),
 linear-gradient(155deg,#07131a 0%,#06100f 42%,#100d16 100%)}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.62;background-image:
 radial-gradient(1px 1px at 7% 13%,rgba(238,246,236,.9) 50%,transparent 100%),
 radial-gradient(1px 1px at 18% 42%,rgba(238,246,236,.65) 50%,transparent 100%),
 radial-gradient(1.5px 1.5px at 31% 9%,rgba(255,220,150,.75) 50%,transparent 100%),
 radial-gradient(1px 1px at 43% 27%,rgba(238,246,236,.55) 50%,transparent 100%),
 radial-gradient(1px 1px at 57% 12%,rgba(238,246,236,.75) 50%,transparent 100%),
 radial-gradient(1.5px 1.5px at 69% 37%,rgba(255,220,150,.65) 50%,transparent 100%),
 radial-gradient(1px 1px at 81% 16%,rgba(238,246,236,.7) 50%,transparent 100%),
 radial-gradient(1px 1px at 93% 54%,rgba(238,246,236,.55) 50%,transparent 100%),
 radial-gradient(1px 1px at 12% 83%,rgba(238,246,236,.5) 50%,transparent 100%),
 radial-gradient(1.5px 1.5px at 76% 88%,rgba(255,220,150,.55) 50%,transparent 100%)}
body:after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 36%,rgba(0,0,0,.42) 100%)}
main{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:100vw;height:100svh;min-height:100svh;margin:0;padding:0;overflow:hidden;background:transparent}
.scene{position:relative;isolation:isolate;flex:none;width:min(100vmin,900px);height:min(100vmin,900px);background:transparent;overflow:visible;z-index:1}
.scene:before{content:"";position:absolute;inset:3%;z-index:-1;pointer-events:none;border-radius:50%;background:
 radial-gradient(ellipse at 50% 56%,rgba(38,111,66,.27),rgba(22,70,51,.13) 37%,transparent 69%),
 radial-gradient(ellipse at 50% 88%,rgba(255,187,94,.12),transparent 37%);filter:blur(19px)}
.scene:after{content:"";position:absolute;left:8%;right:8%;bottom:3%;height:19%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse,rgba(203,225,222,.10),transparent 68%);filter:blur(13px)}
#render{position:relative;width:100%;height:100%;display:block;image-rendering:auto}
.hud{position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;font-size:10px;color:#c2b36f;text-shadow:0 1px 5px #000;pointer-events:none}
#page-snow{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:5}
.credit{position:fixed;left:0;right:0;bottom:max(13px,env(safe-area-inset-bottom));z-index:7;text-align:center;color:rgba(232,216,165,.94);font-size:11px;letter-spacing:.13em;text-shadow:0 1px 10px #000,0 0 16px rgba(255,196,98,.24);pointer-events:none}
.credit span{color:#667c6e;padding:0 5px}

.fairy-lights{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
.wire{fill:none;stroke:rgba(70,91,69,.65);stroke-width:2;stroke-linecap:round}
.side-wire{stroke-width:1.6;opacity:.72}
.bulb{stroke:rgba(255,255,255,.25);stroke-width:1;animation:bulb-pulse 2.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.b-gold{fill:#ffd36c;filter:drop-shadow(0 0 5px rgba(255,195,84,.95))}
.b-red{fill:#ff5b61;filter:drop-shadow(0 0 5px rgba(255,65,75,.9));animation-delay:.7s}
.b-green{fill:#64e58a;filter:drop-shadow(0 0 6px rgba(69,227,127,.9));animation-delay:1.3s}
.b-blue{fill:#73c9ff;filter:drop-shadow(0 0 5px rgba(95,180,255,.9));animation-delay:1.9s}
@keyframes bulb-pulse{from{opacity:.55}to{opacity:1}}
.ambient-glow{position:fixed;inset:auto 0 0;height:32vh;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 100%,rgba(36,105,66,.15),transparent 70%)}
@media(max-width:520px){.hud{font-size:9px;left:8px;right:8px;bottom:7px}.credit{font-size:10px;letter-spacing:.1em}}
@media(prefers-reduced-motion:reduce){.credit{text-shadow:none}.bulb{animation:none}}
</style></head>
<body>
<canvas id="page-snow" aria-hidden="true"></canvas>
<svg class="fairy-lights" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <filter id="bulb-glow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path class="wire" d="M0 15 C130 88 190 6 310 38 S500 78 620 35 S850 5 1000 48"/>
  <path class="wire side-wire" d="M18 45 C-5 210 52 300 20 455 S-2 760 30 970"/>
  <path class="wire side-wire" d="M982 50 C1008 210 950 330 980 500 S1005 790 970 970"/>
  <g filter="url(#bulb-glow)">
    <circle class="bulb b-gold" cx="65" cy="45" r="6"/><circle class="bulb b-red" cx="145" cy="61" r="5"/>
    <circle class="bulb b-green" cx="230" cy="39" r="6"/><circle class="bulb b-blue" cx="320" cy="40" r="5"/>
    <circle class="bulb b-gold" cx="410" cy="61" r="6"/><circle class="bulb b-red" cx="500" cy="58" r="5"/>
    <circle class="bulb b-green" cx="592" cy="42" r="6"/><circle class="bulb b-blue" cx="690" cy="31" r="5"/>
    <circle class="bulb b-gold" cx="790" cy="23" r="6"/><circle class="bulb b-red" cx="890" cy="25" r="5"/>
    <circle class="bulb b-green" cx="965" cy="38" r="6"/>
    <circle class="bulb b-red" cx="18" cy="230" r="5"/><circle class="bulb b-gold" cx="28" cy="430" r="6"/>
    <circle class="bulb b-blue" cx="18" cy="650" r="5"/><circle class="bulb b-green" cx="27" cy="850" r="6"/>
    <circle class="bulb b-green" cx="982" cy="245" r="6"/><circle class="bulb b-red" cx="974" cy="460" r="5"/>
    <circle class="bulb b-gold" cx="985" cy="680" r="6"/><circle class="bulb b-blue" cx="976" cy="875" r="5"/>
  </g>
</svg>
<div class="ambient-glow" aria-hidden="true"></div>
<main>
  <section class="scene">
    <canvas id="render" width="805" height="805"></canvas>
    <div class="hud"><span>ASCII CHRISTMAS</span><span id="fps">30 FPS · 3D ASCII</span></div>
  </section>
</main>
<footer class="credit">Aeryx Project <span>|</span> AeryxVPN</footer>
<script>
(()=>{
'use strict';
const W=805,H=805,CW=5,CH=7,COLS=W/CW,ROWS=H/CH,CAM=9,FOCAL=2250*805/900,TILT=.22;
const BASE=-1.2,TREE_H=2.5,TREE_R=1.15,TIERS=5;
const C={gold:[255,205,70],red:[230,45,50],green:[30,155,48],wood:[110,70,40]};
const BAUBLES=[C.red,C.gold,[70,130,255],[255,125,190],[255,150,40],[170,90,230]];
const glyphRows={
'0':['.###.','#...#','#..##','#.#.#','##..#','#...#','.###.'],
'1':['..#..','.##..','..#..','..#..','..#..','..#..','.###.'],
'#':['.#.#.','.#.#.','#####','.#.#.','#####','.#.#.','.#.#.'],
'$':['..#..','.####','#.#..','.###.','..#.#','####.','..#..'],
'%':['##..#','##..#','...#.','..#..','.#...','#..##','#..##'],
'&':['.##..','#..#.','#.#..','.#...','#.#.#','#..#.','.##.#'],
'*':['.....','#.#.#','.###.','#####','.###.','#.#.#','.....'],
'+':['.....','..#..','..#..','#####','..#..','..#..','.....'],
'=':['.....','.....','#####','.....','#####','.....','.....'],
'@':['.###.','#...#','#.###','#.#.#','#.###','#....','.###.']
};
const glyphNames='01#$%&*+=@';
const glyphs=glyphNames.split('').map(ch=>glyphRows[ch].map(row=>Array.from(row,c=>c==='#'?1:0)));
const canvas=document.getElementById('render'),ctx=canvas.getContext('2d',{alpha:true});
const image=ctx.createImageData(W,H),pix=image.data;
let seed=7;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function rand(a,b){return a+(b-a)*rnd()}
function vecColor(c){return c}
function treeRadius(h){const frac=(h*TIERS)%1;return TREE_R*(1-h)*(.62+.38*(1-frac))}
function rotY(x,y,z,a){const c=Math.cos(a),s=Math.sin(a);return [x*c+z*s,y,-x*s+z*c]}
const P=[],COL=[],T=[];
function add(x,y,z,col,t){P.push(x,y,z);COL.push(col[0],col[1],col[2]);T.push(t)}
function sphere(cx,cy,cz,r,n,col,t){for(let i=0;i<n;i++){let x=rand(-1,1),y=rand(-1,1),z=rand(-1,1),l=Math.hypot(x,y,z)||1;add(cx+x/l*r,cy+y/l*r,cz+z/l*r,col,t)}}
function buildScene(){
 // snowy ground disc, same point-cloud construction as source
 for(let i=0;i<34000;i++){const r=1.8*Math.sqrt(rnd()),a=rnd()*Math.PI*2,shade=190+rnd()*60;add(r*Math.cos(a),BASE-.02,r*Math.sin(a),[shade*.85,shade*.93,shade],r*.35)}
 for(let i=0;i<120;i++){const a=rnd()*Math.PI*2;add(.13*Math.cos(a),BASE+rnd()*.3,.13*Math.sin(a),C.wood,.2)}
 for(let i=0;i<22000;i++){const h=rnd()**.85,a=rnd()*Math.PI*2,r=treeRadius(h)*(1-rnd()**3*.85),k=rnd();add(r*Math.cos(a),BASE+h*TREE_H,r*Math.sin(a),[15+35*k,105+125*k,25+40*k],.4+h*2.8+rnd()*.25)}
 // red garland spiral
 for(let i=0;i<3500;i++){const h=.07+i/3499*.83,a=h*5.5*2*Math.PI,r=treeRadius(h)*1.04;add(r*Math.cos(a),BASE+h*TREE_H+rand(-.02,.02),r*Math.sin(a),C.red.map(v=>v*rand(.8,1.1)),3.4+(h-.07)*2.2)}
 // baubles
 for(let i=0;i<20;i++){const h=rand(.08,.85),a=rnd()*Math.PI*2,r=treeRadius(h)*.97,col=BAUBLES[i%BAUBLES.length];sphere(r*Math.cos(a),BASE+h*TREE_H-.03,r*Math.sin(a),.1,260,col,4.6+i*.12)}
 // five-point star point cloud
 let count=0;while(count<800){const x=rand(-1,1),y=rand(-1,1),ang=Math.atan2(y,x),rad=Math.hypot(x,y),d=Math.abs(((ang-Math.PI/2+Math.PI/5)%(2*Math.PI/5)+2*Math.PI)%(2*Math.PI/5)-Math.PI/5);if(rad<=1+(.42-1)*d/(Math.PI/5)){add(x*.19,BASE+TREE_H+.13+y*.19,rand(-.04,.04),[255,215,80],4.2);count++}}
 // gifts: point-cloud boxes with ribbon color
 const gifts=[
 [200,1.20,[.55,.42,.50],25,[150,100,210],C.gold,0],
 [250,1.05,[.42,.55,.42],-15,[60,170,90],C.red,.25],
 [320,1.30,[.60,.40,.50],40,C.red,C.gold,.50],
 [10,1.20,[.45,.35,.45],10,[60,100,230],C.red,.75],
 [80,1.25,[.50,.45,.50],-30,[235,120,40],C.gold,1],
 [140,1.10,[.38,.30,.38],20,C.red,C.gold,1.25]
 ];
 for(const [deg,dist,size,yaw,color,rib,delay] of gifts){
  const [sx,sy,sz]=size,a=deg*Math.PI/180,ya=yaw*Math.PI/180,bx=dist*Math.cos(a),by=BASE+sy/2,bz=dist*Math.sin(a);
  const areas=[sy*sz,sy*sz,sx*sz,sx*sz,sx*sy,sx*sy],sum=areas.reduce((x,y)=>x+y,0);
  for(let i=0;i<3200;i++){
   let pick=rnd()*sum,face=0;while(face<5&&(pick-=areas[face])>0)face++;
   let xyz=[rand(-.5,.5)*sx,rand(-.5,.5)*sy,rand(-.5,.5)*sz],axis=Math.floor(face/2),sign=face%2?1:-1;xyz[axis]=sign*size[axis]/2;
   const normalAxis=axis, width=.06*(sx+sz),isRibbon=((Math.abs(xyz[0])<width&&normalAxis!==0)||(Math.abs(xyz[2])<width&&normalAxis!==2));
   const rotated=rotY(xyz[0],xyz[1],xyz[2],ya),shade=rand(.85,1.1),col=(isRibbon?rib:color).map(v=>v*shade);
   add(rotated[0]+bx,rotated[1]+by,rotated[2]+bz,col,5.4+delay+(xyz[1]/sy+.5)*.4+(isRibbon?.35:0));
  }
  for(const sign of [-1,1])sphere(bx,by+sy/2+.03,bz,.055,40,rib,6.6+delay);
 }
}
buildScene();
const N=T.length;
const cellDepth=new Float32Array(COLS*ROWS),cellIndex=new Int32Array(COLS*ROWS),cellRGB=new Uint8Array(COLS*ROWS*3);
function project(x,y,z,angle){const c=Math.cos(angle),s=Math.sin(angle),rx=x*c+z*s,rz=-x*s+z*c,ct=Math.cos(TILT),st=Math.sin(TILT),yy=y*ct-rz*st,zz=y*st+rz*ct,k=FOCAL/(CAM-zz);return [W/2+rx*k,H/2-yy*k,zz]}
function putGlyph(cell,idx){
 const gx=cell%COLS,gy=(cell/COLS)|0,gi=idx%10,mask=glyphs[gi],offX=gx*CW,offY=gy*CH,base=cell*3;
 const r=cellRGB[base],g=cellRGB[base+1],b=cellRGB[base+2];
 for(let yy=0;yy<CH;yy++)for(let xx=0;xx<CW;xx++){
  const on=mask[yy][xx],mul=on?1:.38,pi=((offY+yy)*W+offX+xx)*4;
  pix[pi]=r;pix[pi+1]=g;pix[pi+2]=b;pix[pi+3]=on?255:0;
 }
}
let elapsed=0,angle=0,paused=false,last=performance.now(),lastRender=0;
function render(){
 pix.fill(0);cellDepth.fill(-1e9);cellIndex.fill(-1);
 // nearest point wins each 5x7 character cell, matching the Python source renderer
 const points=[];
 for(let i=0;i<N;i++){if(T[i]>elapsed)continue;const q=project(P[i*3],P[i*3+1],P[i*3+2],angle);const cx=(q[0]/CW)|0,cy=(q[1]/CH)|0;if(cx<0||cx>=COLS||cy<0||cy>=ROWS)continue;const ci=cy*COLS+cx;if(q[2]>=cellDepth[ci]){cellDepth[ci]=q[2];cellIndex[ci]=i}}
 for(let ci=0;ci<cellIndex.length;ci++){const i=cellIndex[ci];if(i<0){cellRGB[ci*3]=0;cellRGB[ci*3+1]=0;cellRGB[ci*3+2]=0;continue}const z=cellDepth[ci],shade=Math.max(.45,Math.min(1,.45+.55*(z+2.2)/4.4));cellRGB[ci*3]=COL[i*3]*shade;cellRGB[ci*3+1]=COL[i*3+1]*shade;cellRGB[ci*3+2]=COL[i*3+2]*shade}
 for(let ci=0;ci<cellIndex.length;ci++){if(cellIndex[ci]>=0)putGlyph(ci,cellIndex[ci])}
 ctx.putImageData(image,0,0);
}
function tick(now){
 // Match the source animation target: render at 30 FPS, even on high-refresh displays.
 if(now-lastRender>=1000/30){
  const dt=Math.min(.1,(now-last)/1000);last=now;lastRender=now;
  if(!paused){elapsed+=dt;angle+=dt*.5}
  render();
 }
 requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();paused=!paused}else if(e.key.toLowerCase()==='r'){elapsed=0}});


// Viewport-wide snowfall: independent of the 3D scene, so flakes cross the
// entire browser window rather than stopping at the square render canvas.
const snowCanvas=document.getElementById('page-snow');
const snowCtx=snowCanvas.getContext('2d');
let flakes=[],viewW=0,viewH=0,snowDpr=1;
function resizePageSnow(){
  snowDpr=Math.min(window.devicePixelRatio||1,2);
  viewW=window.innerWidth;viewH=window.innerHeight;
  snowCanvas.width=Math.round(viewW*snowDpr);
  snowCanvas.height=Math.round(viewH*snowDpr);
  snowCanvas.style.width=viewW+'px';snowCanvas.style.height=viewH+'px';
  snowCtx.setTransform(snowDpr,0,0,snowDpr,0,0);
  const count=Math.max(95,Math.min(260,Math.round(viewW*viewH/4600)));
  flakes=Array.from({length:count},()=>({
    x:Math.random()*viewW,y:Math.random()*viewH,
    radius:.45+Math.random()*1.35,
    speed:.35+Math.random()*1.05,
    drift:(Math.random()-.5)*.34,
    alpha:.22+Math.random()*.62,
    phase:Math.random()*Math.PI*2
  }));
}
function drawPageSnow(now){
  snowCtx.clearRect(0,0,viewW,viewH);
  for(const flake of flakes){
    flake.y+=flake.speed;
    flake.x+=flake.drift+Math.sin(now*.00055+flake.phase)*.18;
    if(flake.y>viewH+4){flake.y=-4;flake.x=Math.random()*viewW;}
    if(flake.x<-4)flake.x=viewW+4;
    if(flake.x>viewW+4)flake.x=-4;
    snowCtx.globalAlpha=flake.alpha;
    snowCtx.fillStyle='#e7f1f3';
    snowCtx.beginPath();
    snowCtx.arc(flake.x,flake.y,flake.radius,0,Math.PI*2);
    snowCtx.fill();
  }
  snowCtx.globalAlpha=1;
  requestAnimationFrame(drawPageSnow);
}
window.addEventListener('resize',resizePageSnow,{passive:true});
resizePageSnow();
requestAnimationFrame(drawPageSnow);
})();
</script></body></html>
